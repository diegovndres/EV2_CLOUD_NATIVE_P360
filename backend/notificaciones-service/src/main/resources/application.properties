spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/14c021dd-6b1d-423e-a9f9-e59b17394821/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=api://ac0cd280-33b6-4d33-ae42-aa056c7029fa,ac0cd280-33b6-4d33-ae42-aa056c7029fa

logging.level.org.springframework.security=DEBUG

server.port=8084


spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.rabbitmq.listener.prefetch=10
app.rabbitmq.listener.concurrency=2
app.rabbitmq.listener.max-concurrency=4

app.rabbitmq.max-retries=3
app.rabbitmq.dlx-exchange=pedidos360.dlx
app.rabbitmq.pedidos-exchange=pedidos.exchange
app.rabbitmq.routing-key-pedido-creado=pedido.creado
app.rabbitmq.clientes-exchange=clientes.exchange
app.rabbitmq.routing-key-cliente-creado=cliente.creado
app.rabbitmq.queue-notificacion-pedido=notificaciones.pedido.queue
app.rabbitmq.queue-notificacion-pedido-dlq=notificaciones.pedido.dlq
app.rabbitmq.queue-ticket-pedido=tickets.pedido.queue
app.rabbitmq.queue-ticket-pedido-dlq=tickets.pedido.dlq
app.rabbitmq.queue-notificacion-cliente=notificaciones.cliente.queue
app.rabbitmq.queue-notificacion-cliente-dlq=notificaciones.cliente.dlq
app.rabbitmq.notificaciones-exchange=notificaciones.exchange
app.rabbitmq.routing-key-notificacion-manual=notificacion.manual
app.rabbitmq.queue-notificacion-manual=notificaciones.manual.queue
app.rabbitmq.queue-notificacion-manual-dlq=notificaciones.manual.dlq

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=1500000
# ===================== KAFKA =====================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}

# Consumidor
spring.kafka.consumer.group-id=notificaciones-stock-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=cl.duocuc.pedidos360.notificaciones_service.messaging.kafka.StockAlertaEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=cl.duocuc.pedidos360.notificaciones_service.messaging.kafka
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=2

# Productor (solo se usa para publicar en el DLT)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Parametros propios
app.kafka.topic.stock-alertas=stock-alertas
app.kafka.consumer.max-retries=3
app.kafka.consumer.retry-interval-ms=1000