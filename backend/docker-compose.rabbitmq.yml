services:
  rabbit1:
    image: rabbitmq:3-management
    container_name: pedidos360-rabbit1
    hostname: rabbit1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: pedidos360-secret-cookie
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - rabbit1_data:/var/lib/rabbitmq
    networks: [pedidos360-net]
    restart: unless-stopped

  rabbit2:
    image: rabbitmq:3-management
    container_name: pedidos360-rabbit2
    hostname: rabbit2
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: pedidos360-secret-cookie
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-cluster.conf:ro
      - rabbit2_data:/var/lib/rabbitmq
    depends_on: [rabbit1]
    networks: [pedidos360-net]
    restart: unless-stopped

volumes:
  rabbit1_data:
  rabbit2_data:

networks:
  pedidos360-net:
    external: true