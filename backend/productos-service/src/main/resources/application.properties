spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/14c021dd-6b1d-423e-a9f9-e59b17394821/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=api://ac0cd280-33b6-4d33-ae42-aa056c7029fa,ac0cd280-33b6-4d33-ae42-aa056c7029fa

logging.level.org.springframework.security=DEBUG

server.port=8082

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1


spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=1500000

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.rabbitmq.listener.prefetch=10
app.rabbitmq.listener.concurrency=2
app.rabbitmq.listener.max-concurrency=4

app.rabbitmq.max-retries=3
app.rabbitmq.dlx-exchange=pedidos360.dlx
app.rabbitmq.pedidos-exchange=pedidos.exchange
app.rabbitmq.routing-key-pedido-creado=pedido.creado
app.rabbitmq.queue-inventario-pedido=inventario.pedido.queue
app.rabbitmq.queue-inventario-pedido-dlq=inventario.pedido.dlq

# ================= KAFKA =================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093}
spring.kafka.client-id=productos-service

# Productor
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[linger.ms]=5
# Si Kafka cae, el consumidor de RabbitMQ no debe quedar bloqueado
spring.kafka.producer.properties[max.block.ms]=3000
spring.kafka.producer.properties[request.timeout.ms]=5000
spring.kafka.producer.properties[delivery.timeout.ms]=10000
# Sin header de tipo Java: cada microservicio usa su propio DTO
spring.kafka.producer.properties[spring.json.add.type.headers]=false

# Tópico de alertas (el productor es dueño del tópico)
app.kafka.topic.stock-alertas=stock-alertas
app.kafka.topic.stock-alertas-partitions=2
app.kafka.topic.stock-alertas-replicas=2
app.kafka.topic.stock-alertas-retention-ms=172800000
# Se alerta cuando el stock queda en este valor o menos
app.kafka.stock-umbral=5

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}