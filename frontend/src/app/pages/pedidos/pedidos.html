<header class="navbar">
  <div class="navbar-brand">
    <span class="logo-dot"></span>
    <h1>Pedidos<span>360</span></h1>
  </div>
  <nav class="navbar-links">
    <a routerLink="/home" routerLinkActive="active">Dashboard</a>
    <a routerLink="/pedidos" routerLinkActive="active">Pedidos</a>
    <a routerLink="/productos" routerLinkActive="active">Productos</a>
    <a routerLink="/clientes" routerLinkActive="active">Clientes</a>
    <a routerLink="/notificaciones" routerLinkActive="active">Notificaciones</a>
    <a routerLink="/analitica" routerLinkActive="active">Analítica</a>
  </nav>
  <button class="btn-primary">+ Nuevo pedido</button>
</header>
<main class="container">
  <section class="panel">
    <div class="panel-header">
      <h2>Pedidos</h2>
      <input type="text" class="search-input" placeholder="Buscar pedido...">
    </div>
    <table class="orders-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Cliente</th>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Fecha</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        @for (p of pedidos; track p.id) {
          <tr>
            <td>#{{ p.id }}</td>
            <td>{{ p.cliente }}</td>
            <td>{{ p.producto }}</td>
            <td>{{ p.cantidad }}</td>
            <td>{{ p.fecha }}</td>
            <td>
              <span class="badge"
                    [class.badge-success]="p.estado === 'Entregado'"
                    [class.badge-danger]="p.estado === 'Cancelado'"
                    [class.badge-warning]="p.estado === 'Pendiente'">
                {{ p.estado }}
              </span>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="6" class="empty-row">No hay pedidos registrados.</td>
          </tr>
        }
      </tbody>
    </table>
  </section>
</main>
